name: Test & Bench
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./... -count=1 -short

      - name: Go vet
        run: go vet ./...

      - name: Docker build
        run: docker build -t raftlite:test .

  deterministic-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: DST harness
        run: go test ./internal/transport/... -run TestDSTDeterminism -v
